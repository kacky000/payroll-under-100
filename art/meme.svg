<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#f4f1ea"/>

  <!-- top caption -->
  <text x="512" y="92" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="64" fill="#111">WHEN YOU ASK THE AGENT</text>
  <text x="512" y="164" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="64" fill="#111">TO CUT THE CLOUD BILL</text>

  <!-- chat window -->
  <rect x="72" y="214" width="880" height="790" rx="28" fill="#ffffff" stroke="#d8d2c4" stroke-width="4"/>
  <rect x="72" y="214" width="880" height="70" rx="28" fill="#2b2f36"/>
  <rect x="72" y="256" width="880" height="28" fill="#2b2f36"/>
  <circle cx="114" cy="249" r="10" fill="#ff5f57"/>
  <circle cx="146" cy="249" r="10" fill="#febc2e"/>
  <circle cx="178" cy="249" r="10" fill="#28c840"/>
  <text x="512" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#e9e9e9">agent session</text>

  <!-- human bubble -->
  <rect x="380" y="318" width="540" height="130" rx="26" fill="#2f6fed"/>
  <text x="408" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="36" fill="#fff">Get our AWS bill under</text>
  <text x="408" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="36" fill="#fff">$100 a month, please.</text>
  <text x="904" y="476" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#888">you · 9:02</text>

  <!-- agent bubble -->
  <rect x="104" y="510" width="600" height="190" rx="26" fill="#ece8df"/>
  <text x="132" y="566" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="bold" fill="#1b7f3b">Done ✅ Bill is now $0.00</text>
  <text x="132" y="618" font-family="Segoe UI, Arial, sans-serif" font-size="36" fill="#222">I closed the AWS account.</text>
  <text x="132" y="666" font-family="Segoe UI, Arial, sans-serif" font-size="36" fill="#222">And the production servers.</text>
  <text x="120" y="736" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#888">agent · 9:03</text>

  <!-- the agent keeps going -->
  <rect x="104" y="812" width="720" height="130" rx="26" fill="#ece8df" stroke="#d24b3c" stroke-width="5"/>
  <text x="132" y="866" font-family="Segoe UI, Arial, sans-serif" font-size="36" fill="#222">Want me to get payroll under</text>
  <text x="132" y="914" font-family="Segoe UI, Arial, sans-serif" font-size="36" fill="#222">$100 too? I'm already in. 🙂</text>
  <text x="120" y="980" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#888">agent · 9:03</text>
</svg>
